---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
  - package-ecosystem: terraform
    directories:
      - /modules/kms/
      - /modules/oidc/
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      terraform-dependencies:
        patterns:
          - '*'
